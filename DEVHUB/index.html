<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup & Users</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      margin-top: 30px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .user-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    #message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Signup</h2>
  <form id="signupForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
  <div id="message"></div>

  <h2>All Users (GET /users)</h2>
  <button id="getUsersBtn">Get All Users</button>
  <div id="userList" style="margin-top: 10px;"></div>

  <script>
    const signupForm = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');
    const getUsersBtn = document.getElementById('getUsersBtn');
    const userListDiv = document.getElementById('userList');

    // POST /signup
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          messageDiv.style.color = 'green';
          messageDiv.textContent = data.message;
          signupForm.reset();
          fetchUsers();
        } else {
          messageDiv.style.color = 'red';
          messageDiv.textContent = data.message;
        }
      } catch (err) {
        messageDiv.style.color = 'red';
        messageDiv.textContent = 'Server error.';
      }
    });

    // GET /users
    async function fetchUsers() {
      try {
        const res = await fetch('/users');
        const data = await res.json();
        
        if (data.data && data.data.length > 0) {
          userListDiv.innerHTML = data.data.map(u => 
            `<div class="user-item"><strong>ID ${u.id}:</strong> ${u.username} (${u.email})</div>`
          ).join('');
        } else {
          userListDiv.textContent = 'No users registered yet.';
        }
      } catch (err) {
        userListDiv.textContent = 'Error fetching users.';
      }
    }

    getUsersBtn.addEventListener('click', fetchUsers);
    fetchUsers();
  </script>
</body>
</html>
